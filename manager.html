<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KIXIE | Manager</title>
<style>
  :root { color-scheme:dark; --ink:#e5e7eb; --muted:#9ca3af; --line:#2d3748; --ok:#22c55e; --okbg:#0f2e1c; --warn:#fbbf24; --warnbg:#33270a; --bad:#f87171; --badbg:#3a1414; --brand:#0b0f17; --bg:#111827; --panel:#1a2230; --head:#222c3c; --day:#161e2b; --pill:#273449; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header .sub { opacity:.75; font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 12px; border-radius:8px; cursor:pointer; }
  button.primary { background:#15803d; color:#fff; border-color:var(--ok); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:var(--pill); margin:1px 2px; }
  .pill.ok { background:var(--okbg); color:var(--ok); } .pill.warn { background:var(--warnbg); color:var(--warn); } .pill.bad { background:var(--badbg); color:var(--bad); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; margin-bottom:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card b { font-size:20px; display:block; }
  .msg { padding:10px 12px; border-radius:8px; margin-bottom:12px; display:none; white-space:pre-wrap; }
  .msg.show { display:block; } .msg.ok { background:var(--okbg); } .msg.bad { background:var(--badbg); } .msg.warn { background:var(--warnbg); }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { background:var(--head); font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  tr.day td { background:var(--day); font-weight:600; }
  select { font:inherit; padding:5px 6px; border-radius:6px; border:1px solid var(--line); min-width:120px; background:var(--bg); color:var(--ink); }
  td.small { color:var(--muted); font-size:12px; }
  @media (max-width:640px){ .hide-sm { display:none; } th, td { padding:6px; } }
</style>
</head>
<body>
<header><h1>KIXIE | Manager</h1><div class="sub" id="sub">Loading…</div></header>
<main>
  <div class="bar">
    <button id="prev">◀ Prev week</button>
    <button id="next">Next week ▶</button>
    <span style="flex:1"></span>
    <button id="gen">Regenerate fair draft</button>
    <button id="approve" class="primary">Approve schedule</button>
  </div>
  <div id="msg" class="msg"></div>
  <div id="trello" class="card" style="display:none;margin-bottom:12px">
    <b style="font-size:15px">Connect Trello</b>
    <div class="small" style="color:var(--muted);margin:4px 0 8px">Paste your Trello API key and token. Approved sessions then go to the "KIXIE | Call Sessions" board, and move to Done or Missed when logged.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px">
      <input id="tkey" type="password" autocomplete="off" placeholder="API key" style="font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)">
      <input id="ttok" type="password" autocomplete="off" placeholder="Token" style="font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)">
      <button id="tgo" class="primary">Connect</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <table>
    <thead><tr><th>Eastern (ET)</th><th class="hide-sm">Pacific (PT, Luke)</th><th>Marked available</th><th>Assigned</th><th class="hide-sm">Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="small" id="help" style="color:var(--muted)"></p>
</main>
<script src="api.js"></script>
<script>
const TOKEN = KX.t || '';
let WEEK = KX.w || '';
let DATA = null;
const $ = id => document.getElementById(id);

function say(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg show ' + (kind || 'ok'); }
function busy(on) { ['gen','approve','prev','next'].forEach(id => $(id).disabled = on); }
function fail(e) { busy(false); say(e && e.message ? e.message : String(e), 'bad'); }

function load(week) {
  busy(true);
  google.script.run.withSuccessHandler(d => { DATA = d; WEEK = d.week; render(); busy(false); })
    .withFailureHandler(fail).ksManagerView(TOKEN, week || WEEK);
}

function currentAssignments() {
  const a = {};
  document.querySelectorAll('select[data-id]').forEach(s => { a[s.dataset.id] = s.value; });
  return a;
}

const LEN = () => (DATA && DATA.slotHours) || 2;
const COLORS = ['#3b82f6', '#f59e0b', '#ec4899', '#10b981', '#a78bfa'];
function fmtH(h) { const ap = h >= 12 ? 'PM' : 'AM', x = h % 12 || 12; return x + ' ' + ap; }
function etLabel(s) { const h = parseInt(s.et, 10); return fmtH(h) + ' – ' + fmtH(h + LEN()); }
function ptLabel(s) { return s.local.replace(/^\w+ \w+ \d+, /, '').replace(/:00/g, '').replace(' - ', ' – '); }

function render() {
  const d = DATA, st = d.status;
  const approved = /^approved$/i.test(st.decision);
  $('sub').textContent = 'Week of ' + d.week + ' · ' + (st.version ? 'Draft ' + st.version : 'No draft yet') +
    ' · ' + (approved ? 'APPROVED' : (st.decision || 'Pending')) + ' · ' + (st.publication || 'NOT PUBLISHED') +
    (d.publishEnabled ? '' : ' · publishing off');
  $('trello').style.display = 'none';
  $('help').textContent = (LEN() === 1
    ? 'Each row is 1 hour, 10 AM to 8 PM Eastern. Regenerate fair draft keeps each caller\'s hours back to back (usually 2 in a row). The colored bar shows who has Kixie.'
    : 'Each row is a 2-hour block. Blocks that would overlap a booked block are hidden, so nothing can double-book Kixie.') +
    ' Bold times are Eastern. Change a dropdown to reassign (you can pick anyone), then press Approve. Nothing is published until you approve.';
  const tb = $('rows'); tb.innerHTML = '';
  const live = s => s.approved && !/cancel/i.test(s.approved.state) ? s.approved.caller : (s.approved ? '' : s.draft);
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  const byDay = {};
  d.sessions.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  Object.keys(byDay).sort().forEach(date => {
    // Show every booked block, then only empty blocks that don't overlap anything shown. No overlaps on screen.
    const all = byDay[date].map(s => Object.assign({ h: parseInt(s.et, 10), who: live(s) }, s));
    const shown = all.filter(s => s.who);
    all.filter(s => !s.who).sort((a, b) => a.h - b.h).forEach(s => {
      if (!shown.some(o => Math.abs(o.h - s.h) < LEN())) shown.push(s);
    });
    shown.sort((a, b) => a.h - b.h);
    const past = date < today;
    const tr = document.createElement('tr'); tr.className = 'day';
    tr.innerHTML = '<td colspan="5">' + new Date(date + 'T12:00:00Z').toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric', timeZone:'UTC'}) + (past ? ' <span class="small">(past)</span>' : '') + '</td>';
    tb.appendChild(tr);
    shown.forEach(s => {
      const row = document.createElement('tr');
      if (past) row.style.opacity = '.55';
      const opts = ['<option value="">— nobody —</option>'].concat(d.callers.map(c =>
        '<option value="' + c.name + '"' + (c.name === s.who ? ' selected' : '') + '>' + c.name + '</option>'));
      const pub = s.approved && !/cancel/i.test(s.approved.state);
      const statusPill = pub ? '<span class="pill ' + (/^published$/i.test(s.approved.state) ? 'ok' : /fail|partial/i.test(s.approved.state) ? 'bad' : 'warn') + '">' + s.approved.state + '</span>'
        : (s.who ? '<span class="pill">draft</span>' : '');
      row.innerHTML = '<td><b>' + etLabel(s) + '</b></td><td class="small hide-sm">' + ptLabel(s) + '</td>' +
        '<td>' + (s.available.map(n => '<span class="pill">' + n + '</span>').join('') || '<span class="small">—</span>') + '</td>' +
        '<td><select data-id="' + s.id + '">' + opts.join('') + '</select></td><td class="hide-sm">' + statusPill + '</td>';
      tb.appendChild(row);
    });
  });
  document.querySelectorAll('select[data-id]').forEach(s => s.addEventListener('change', summarise));
  summarise();
}

function summarise() {
  const a = currentAssignments(), hours = {};
  Object.keys(a).forEach(k => { if (a[k]) hours[a[k]] = (hours[a[k]] || 0) + LEN(); });
  document.querySelectorAll('select[data-id]').forEach(s => {
    const i = DATA.callers.findIndex(c => c.name === s.value);
    s.closest('tr').style.boxShadow = i >= 0 ? 'inset 4px 0 0 ' + COLORS[i % COLORS.length] : '';
  });
  $('cards').innerHTML = DATA.callers.map(c => {
    const h = hours[c.name] || 0;
    const cls = h === c.targetHours ? 'ok' : h < c.targetHours ? 'warn' : 'bad';
    return '<div class="card">' + c.name + '<b>' + h + 'h <span class="pill ' + cls + '">target ' + c.targetHours + 'h</span></b>' +
      '<span class="small">' + (c.submitted ? 'availability submitted' : '<span class="pill bad">no availability yet</span>') + '</span></div>';
  }).join('');
}

$('prev').onclick = () => load(DATA.prevWeek);
$('next').onclick = () => load(DATA.nextWeek);
$('gen').onclick = () => {
  if (/^approved$/i.test(DATA.status.decision)) return say('This week is already approved. Reassign with the dropdowns and press Approve again.', 'warn');
  busy(true); say('Building the fairest schedule from everyone\'s latest availability…', 'warn');
  google.script.run.withSuccessHandler(r => {
    say('Draft ' + r.version + ' ready.' + (r.flags.length ? '\n' + r.flags.join('\n') : ' Everyone got full hours.'), r.flags.length ? 'warn' : 'ok');
    load(WEEK);
  }).withFailureHandler(fail).ksManagerGenerate(TOKEN, WEEK);
};
$('approve').onclick = () => {
  const a = currentAssignments();
  const n = Object.values(a).filter(Boolean).length;
  if (!confirm('Approve ' + n + ' sessions for the week of ' + WEEK + '?' + (DATA.publishEnabled ? '\n\nThis will put them on the team calendar and email each caller.' : ''))) return;
  busy(true); say('Validating and approving…', 'warn');
  google.script.run.withSuccessHandler(r => {
    if (!r.ok) { busy(false); return say('Not approved. Fix these first:\n• ' + r.errors.join('\n• '), 'bad'); }
    const p = r.published;
    say('Approved.' + (p ? ' Calendar: ' + p.created + ' created, ' + p.updated + ' updated, ' + p.cancelled + ' removed.' +
      (p.emailed.length ? ' Emailed: ' + p.emailed.join(', ') + '.' : '') + (p.errors.length ? '\nProblems:\n• ' + p.errors.join('\n• ') : '')
      : ' Publishing is off, so nothing was sent to the calendar or callers yet.'), p && p.errors.length ? 'warn' : 'ok');
    load(WEEK);
  }).withFailureHandler(fail).ksManagerApprove(TOKEN, WEEK, DATA.status.version, a);
};
$('tgo').onclick = () => {
  const k = $('tkey').value.trim(), t = $('ttok').value.trim();
  if (!k || !t) return say('Paste both the API key and the token.', 'bad');
  $('tgo').disabled = true; say('Checking with Trello…', 'warn');
  google.script.run.withSuccessHandler(r => {
    $('tkey').value = ''; $('ttok').value = ''; $('tgo').disabled = false;
    say('Trello connected to ' + r.board + '.', 'ok'); load(WEEK);
  }).withFailureHandler(e => { $('tgo').disabled = false; fail(e); }).ksTrelloConnect(TOKEN, k, t);
};
load(WEEK);
</script>
</body>
</html>
