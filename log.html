<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KIXIE | Log a session</title>
<style>
  :root { color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#e5e7eb; background:#111827; }
  header { background:#0b0f17; color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; } header div { opacity:.75; font-size:13px; }
  main { max-width:620px; margin:0 auto; padding:16px; }
  .s { background:#1a2230; border:1px solid #2d3748; border-radius:10px; padding:12px; margin-bottom:12px; }
  .s h3 { margin:0 0 8px; font-size:15px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { font-size:12px; color:#9ca3af; display:block; }
  input, select, textarea { width:100%; font:inherit; padding:7px; border:1px solid #2d3748; border-radius:6px; background:#111827; color:#e5e7eb; }
  button { margin-top:8px; font:inherit; background:#15803d; color:#fff; border:0; padding:9px 14px; border-radius:8px; font-weight:600; cursor:pointer; }
  .done { color:#22c55e; font-size:13px; } .muted { color:#9ca3af; font-size:13px; }
</style>
</head>
<body>
<header><h1>KIXIE | Log a session</h1><div id="sub">Loading…</div></header>
<main id="list"></main>
<script src="api.js"></script>
<script>
const TOKEN = KX.t || '';
const $ = id => document.getElementById(id);
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function load() {
  google.script.run.withSuccessHandler(render).withFailureHandler(e => { $('sub').textContent = e.message; }).ksLogView(TOKEN);
}
function render(d) {
  $('sub').textContent = d.caller + ' · times in ' + d.timezone;
  if (!d.sessions.length) { $('list').innerHTML = '<p class="muted">No published sessions in the last three weeks.</p>'; return; }
  $('list').innerHTML = d.sessions.map(s => {
    const logged = s.attendance && s.attendance !== 'Scheduled' && s.attendance !== 'Not logged';
    if (!s.started) return '<div class="s"><h3>' + esc(s.label) + '</h3><span class="muted">Upcoming. You can log it once it starts.</span></div>';
    return '<div class="s" data-id="' + esc(s.id) + '"><h3>' + esc(s.label) + '</h3>' +
      (logged ? '<div class="done">Logged as ' + esc(s.attendance) + '. You can update it below.</div>' : '') +
      '<div class="row"><div><label>Attendance</label><select name="attendance">' +
      ['completed','partial','missed'].map(v => '<option value="' + v + '"' + (s.attendance.toLowerCase() === v ? ' selected' : '') + '>' + v[0].toUpperCase() + v.slice(1) + '</option>').join('') +
      '</select></div><div><label>Hours actually called</label><input name="actualHours" type="number" step="0.25" min="0" value="' + esc(s.actualHours === '' || s.actualHours == null ? 2 : s.actualHours) + '"></div>' +
      '<div><label>Calls made</label><input name="calls" type="number" min="0" value="' + esc(s.calls) + '"></div>' +
      '<div><label>Conversations</label><input name="conversations" type="number" min="0" value="' + esc(s.conversations) + '"></div>' +
      '<div><label>Qualified leads</label><input name="leads" type="number" min="0" value="' + esc(s.leads) + '"></div>' +
      '<div><label>Appointments</label><input name="appointments" type="number" min="0" value="' + esc(s.appointments) + '"></div></div>' +
      '<label style="margin-top:8px">Notes</label><textarea name="notes" rows="2">' + esc(s.notes) + '</textarea>' +
      '<button>Save</button> <span class="muted" data-out></span></div>';
  }).join('');
  document.querySelectorAll('.s[data-id] button').forEach(b => b.onclick = () => {
    const box = b.closest('.s'), data = {};
    box.querySelectorAll('[name]').forEach(i => data[i.name] = i.value);
    const out = box.querySelector('[data-out]'); out.textContent = 'Saving…'; b.disabled = true;
    google.script.run.withSuccessHandler(() => { out.textContent = 'Saved ✓'; b.disabled = false; })
      .withFailureHandler(e => { out.textContent = e.message; b.disabled = false; })
      .ksLogSession(TOKEN, box.dataset.id, data);
  });
}
load();
</script>
</body>
</html>
